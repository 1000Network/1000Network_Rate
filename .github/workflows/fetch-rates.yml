name: Fetch Market Rates & Update API

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml cloudscraper matplotlib tzdata

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.io'
          git add market.json README.md api/ charts/ share/
          # بررسی اگر تغییری وجود داشت کامیت کن
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): update rates, API history and charts [skip ci]"
            # دریافت تغییرات احتمالی شما از روی سرور و ترکیب با فایل‌های جدید
            git pull origin main --rebase
            git push
          else
            echo "No changes to commit"
          fi
