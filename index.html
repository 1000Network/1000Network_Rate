<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرخ لحظه‌ای ارز، طلا و سکه | شبکه هزاره</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 122, 0, 0.25);
            --primary-orange: #ff7a00;
            --primary-orange-glow: rgba(255, 122, 0, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top center, #111827 0%, #07090e 100%);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px 28px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 122, 0, 0.1);
            border: 2px solid var(--primary-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px var(--primary-orange-glow);
        }

        .brand-logo-circle::after {
            content: '';
            width: 14px;
            height: 14px;
            background: var(--primary-orange);
            border-radius: 50%;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
        }

        .brand span {
            font-size: 0.75rem;
            color: var(--primary-orange);
            letter-spacing: 1px;
            display: block;
        }

        .last-update {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .last-update::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Showcase Grid */
        .showcase-title {
            font-size: 0.95rem;
            color: var(--primary-orange);
            margin-bottom: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .showcase-title::before {
            content: '•';
            font-size: 1.5rem;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .showcase-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .showcase-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-orange);
            box-shadow: 0 8px 20px var(--primary-orange-glow);
        }

        .showcase-card.active {
            border: 2px solid var(--primary-orange);
            background: rgba(255, 122, 0, 0.08);
            box-shadow: 0 0 16px var(--primary-orange-glow);
        }

        .showcase-card h3 {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .showcase-card .price {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
        }

        .showcase-card .unit {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }

        /* Chart Section */
        .chart-section {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 22px;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .chart-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }

        .timeframe-bar {
            display: flex;
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 3px;
            gap: 3px;
        }

        .tf-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tf-btn:hover {
            color: #fff;
        }

        .tf-btn.active {
            background: var(--primary-orange);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 0 10px var(--primary-orange-glow);
        }

        .chart-box {
            position: relative;
            height: 420px;
            width: 100%;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .rates-container {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 4px;
        }

        .rates-container::-webkit-scrollbar {
            width: 4px;
        }

        .rates-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }

        .rate-card {
            background: rgba(11, 15, 25, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 3px solid var(--primary-orange);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rate-card:hover {
            background: rgba(255, 122, 0, 0.06);
            transform: translateX(-3px);
        }

        .rate-card.active {
            border: 1px solid var(--primary-orange);
            border-right: 4px solid var(--primary-orange);
            background: rgba(255, 122, 0, 0.12);
        }

        .rate-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
        }

        .rate-code {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .rate-price {
            text-align: left;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .rate-unit {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        @media (max-width: 1024px) {
            .showcase-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                height: 380px;
            }
        }

        @media (max-width: 640px) {
            .showcase-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .chart-header {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }

            .timeframe-bar {
                justify-content: center;
                flex-wrap: wrap;
            }

            .tf-btn {
                padding: 5px 9px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="brand-logo-circle"></div>
                <div>
                    <h1>شبکه هزاره</h1>
                    <span>NETWORK HEZAREH FINANCIAL LAB</span>
                </div>
            </div>
            <div id="lastUpdate" class="last-update">در حال دریافت داده‌ها...</div>
        </header>

        <!-- Showcase -->
        <div class="showcase-title">شاخص‌های اصلی بازار (شبکه هزاره)</div>
        <div id="showcaseGrid" class="showcase-grid"></div>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Chart Section -->
            <div class="chart-section">
                <div class="chart-header">
                    <div id="chartTitle" class="chart-title">نمودار روند قیمت</div>
                    <div class="timeframe-bar">
                        <button class="tf-btn" onclick="setTimeframe(1, this)">۱ روز</button>
                        <button class="tf-btn active" onclick="setTimeframe(7, this)">۱ هفته</button>
                        <button class="tf-btn" onclick="setTimeframe(30, this)">۱ ماه</button>
                        <button class="tf-btn" onclick="setTimeframe(180, this)">۶ ماه</button>
                        <button class="tf-btn" onclick="setTimeframe(365, this)">۱ سال</button>
                    </div>
                </div>
                <div class="chart-box">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <span style="color:#fff;">سایر نرخ‌های بازار</span>
                    <span id="sidebarCount" style="color:var(--primary-orange); font-size:0.85rem;"></span>
                </div>
                <div id="ratesContainer" class="rates-container"></div>
            </div>
        </div>
    </div>

    <script>
        let allRates = {};
        let currentSymbol = 'usd';
        let currentDays = 7;
        let chartInstance = null;

        // پنج شاخص ویترین بالا؛ این موارد در سایدبار نمایش داده نمی‌شوند.
        const showcaseKeys = ['usd', 'eur', 'aed', 'gold_18k', 'coin_emami'];

        // نام نمایشی و واحد هر شاخص
        const rateInfo = {
            usd: ['دلار آمریکا', 'تومان'],
            eur: ['یورو', 'تومان'],
            aed: ['درهم امارات', 'تومان'],
            gold_18k: ['طلای ۱۸ عیار', 'تومان'],
            coin_emami: ['سکه امامی', 'تومان'],
            coin_gram: ['سکه گرمی', 'تومان'],
            coin_quarter: ['ربع سکه', 'تومان'],
            coin_bahar: ['سکه بهار آزادی', 'تومان'],
            coin_half: ['نیم سکه', 'تومان'],
            gold_mesghal: ['مثقال طلا', 'تومان'],
            gold_ounce: ['انس طلا', 'دلار'],
            usd_xau: ['انس جهانی طلا', 'دلار'],
            oil: ['نفت', 'دلار'],
            gbp: ['پوند انگلیس', 'تومان'],
            try: ['لیر ترکیه', 'تومان'],
            cad: ['دلار کانادا', 'تومان'],
            aud: ['دلار استرالیا', 'تومان'],
            cny: ['یوان چین', 'تومان'],
            iqd: ['دینار عراق', 'تومان'],
            myr: ['رینگیت مالزی', 'تومان'],
            rub: ['روبل روسیه', 'تومان'],
            amd: ['درام ارمنستان', 'تومان'],
            azn: ['منات آذربایجان', 'تومان'],
            gel: ['لاری گرجستان', 'تومان'],
            omr: ['ریال عمان', 'تومان'],
            inr: ['روپیه هند', 'تومان'],
            thb: ['بات تایلند', 'تومان'],
            jpy: ['ین ژاپن', 'تومان'],
            sar: ['ریال عربستان', 'تومان'],
            chf: ['فرانک سوئیس', 'تومان'],
            afn: ['افغانی افغانستان', 'تومان'],
            krw: ['وون کره جنوبی', 'تومان'],
            sek: ['کرون سوئد', 'تومان'],
            qar: ['ریال قطر', 'تومان'],
            nzd: ['دلار نیوزیلند', 'تومان'],
            nok: ['کرون نروژ', 'تومان'],
            sgd: ['دلار سنگاپور', 'تومان'],
            bhd: ['دینار بحرین', 'تومان'],
            hkd: ['دلار هنگ‌کنگ', 'تومان'],
            kwd: ['دینار کویت', 'تومان'],
            pkr: ['روپیه پاکستان', 'تومان'],
            dkk: ['کرون دانمارک', 'تومان'],
            tjs: ['سامانی تاجیکستان', 'تومان'],
            tmt: ['منات ترکمنستان', 'تومان'],
            kgs: ['سوم قرقیزستان', 'تومان'],
            syp: ['لیره سوریه', 'تومان'],
            ars: ['پزوی آرژانتین', 'تومان'],
            brl: ['رئال برزیل', 'تومان']
        };

        const metadataKeys = [
            'updated_at',
            'date',
            'date_shamsi',
            'date_shamsi_full',
            'time'
        ];

        function getRate(key) {
            const value = allRates[key];

            if (value === undefined || value === null || value === '') {
                return null;
            }

            const numericValue = Number(value);
            if (!Number.isFinite(numericValue)) {
                return null;
            }

            const info = rateInfo[key] || [key.toUpperCase(), 'تومان'];

            return {
                title: info[0],
                unit: info[1],
                price: numericValue
            };
        }

        async function fetchJson(paths) {
            let lastError = null;

            for (const path of paths) {
                try {
                    const response = await fetch(path, { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} برای ${path}`);
                    }
                    return await response.json();
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error('فایل داده دریافت نشد');
        }

        async function init() {
            try {
                const data = await fetchJson(['market.json', 'api/market.json']);

                // پشتیبانی از ساختار تخت فعلی و ساختار قدیمی‌ترِ دارای rates
                allRates = data && data.rates && typeof data.rates === 'object'
                    ? { ...data, ...data.rates }
                    : data;

                if (!allRates || typeof allRates !== 'object') {
                    throw new Error('ساختار market.json معتبر نیست');
                }

                const updatedAt = allRates.updated_at || allRates.time || '';
                const updatedDate = allRates.date_shamsi_full || allRates.date || '';

                if (updatedAt || updatedDate) {
                    document.getElementById('lastUpdate').textContent =
                        `آخرین بروزرسانی: ${updatedDate} ${updatedAt}`.trim();
                } else {
                    document.getElementById('lastUpdate').textContent = 'اطلاعات بازار دریافت شد';
                }

                buildShowcase();
                buildSidebar();
                await loadChart(currentSymbol);
            } catch (err) {
                console.error('خطا در دریافت اطلاعات بازار:', err);
                document.getElementById('lastUpdate').textContent = 'خطا در دریافت اطلاعات بازار';
            }
        }

        function buildShowcase() {
            const grid = document.getElementById('showcaseGrid');
            grid.innerHTML = '';

            showcaseKeys.forEach(key => {
                const item = getRate(key);
                if (!item) return;

                const card = document.createElement('div');
                card.className = `showcase-card ${currentSymbol === key ? 'active' : ''}`;
                card.id = `card-${key}`;
                card.onclick = () => selectSymbol(key);

                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <div class="price">${format(item.price)}</div>
                    <div class="unit">${item.unit}</div>
                `;

                grid.appendChild(card);
            });
        }

        function buildSidebar() {
            const container = document.getElementById('ratesContainer');
            container.innerHTML = '';

            const otherKeys = Object.keys(allRates).filter(key => {
                if (showcaseKeys.includes(key) || metadataKeys.includes(key)) {
                    return false;
                }
                return getRate(key) !== null;
            });

            document.getElementById('sidebarCount').textContent = `${otherKeys.length} شاخص`;

            otherKeys.forEach(key => {
                const item = getRate(key);
                if (!item) return;

                const card = document.createElement('div');
                card.className = `rate-card ${currentSymbol === key ? 'active' : ''}`;
                card.id = `card-${key}`;
                card.onclick = () => selectSymbol(key);

                card.innerHTML = `
                    <div>
                        <div class="rate-title">${item.title}</div>
                        <div class="rate-code">${key.toUpperCase()}</div>
                    </div>
                    <div class="rate-price">
                        <div>${format(item.price)}</div>
                        <div class="rate-unit">${item.unit}</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function selectSymbol(key) {
            currentSymbol = key;

            document.querySelectorAll('.showcase-card, .rate-card').forEach(element => {
                element.classList.remove('active');
            });

            const activeElement = document.getElementById(`card-${key}`);
            if (activeElement) {
                activeElement.classList.add('active');
            }

            loadChart(key);
        }

        function setTimeframe(days, button) {
            currentDays = days;

            document.querySelectorAll('.tf-btn').forEach(element => {
                element.classList.remove('active');
            });

            button.classList.add('active');
            loadChart(currentSymbol);
        }

        async function loadChart(symbol) {
            const item = getRate(symbol);
            const title = item ? item.title : symbol.toUpperCase();

            document.getElementById('chartTitle').textContent =
                `نمودار روند قیمت (${title})`;

            try {
                const json = await fetchJson([
                    `api/history_${symbol}.json`,
                    `history_${symbol}.json`
                ]);

                let history = Array.isArray(json)
                    ? json
                    : (Array.isArray(json.history) ? json.history : []);

                // نگه داشتن نقاط معتبر و تبدیل قیمت به عدد
                history = history
                    .map(point => ({
                        time: point.time || point.date || point.timestamp || '',
                        price: Number(point.price ?? point.value)
                    }))
                    .filter(point => Number.isFinite(point.price));

                let points = history;

                // محدود کردن تعداد نقاط نمایشی برای بازه‌های مختلف
                if (currentDays === 1) {
                    points = history.slice(-5);
                } else if (currentDays === 7) {
                    points = history.slice(-15);
                } else if (currentDays === 30) {
                    points = history.slice(-30);
                } else if (currentDays === 180) {
                    points = history.slice(-180);
                } else if (currentDays === 365) {
                    points = history.slice(-365);
                }

                const labels = points.map(point => point.time);
                const values = points.map(point => point.price);

                renderChart(labels, values, title, item ? item.unit : 'تومان');
            } catch (error) {
                console.warn(`تاریخچه برای ${symbol} دریافت نشد:`, error);
                renderChart([], [], title, item ? item.unit : 'تومان');
            }
        }

        function renderChart(labels, data, label, unit) {
            const canvas = document.getElementById('priceChart');
            const ctx = canvas.getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, 380);
            gradient.addColorStop(0, 'rgba(255, 122, 0, 0.35)');
            gradient.addColorStop(1, 'rgba(255, 122, 0, 0.0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        borderColor: '#ff7a00',
                        borderWidth: 2.5,
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.35,
                        pointRadius: data.length > 25 ? 0 : 3.5,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#ff7a00',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 1.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(11, 15, 25, 0.95)',
                            titleFont: { family: 'Vazirmatn' },
                            bodyFont: { family: 'Vazirmatn', weight: 'bold' },
                            borderColor: 'rgba(255, 122, 0, 0.3)',
                            borderWidth: 1,
                            padding: 10,
                            callbacks: {
                                label: context =>
                                    ` ${format(context.parsed.y)} ${unit}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.03)'
                            },
                            ticks: {
                                color: '#9ca3af',
                                font: { family: 'Vazirmatn', size: 10 }
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            },
                            ticks: {
                                color: '#9ca3af',
                                font: { family: 'Vazirmatn', size: 11 },
                                callback: value => format(value)
                            }
                        }
                    }
                }
            });
        }

        function format(value) {
            const number = Number(value);

            if (!Number.isFinite(number)) {
                return '۰';
            }

            return new Intl.NumberFormat('en-US', {
                maximumFractionDigits: 2
            }).format(number);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
