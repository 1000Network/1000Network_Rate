<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرخ لحظه‌ای ارز، طلا و سکه | شبکه هزاره</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 122, 0, 0.25);
            --primary-orange: #ff7a00;
            --primary-orange-glow: rgba(255, 122, 0, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top center, #111827 0%, #07090e 100%);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px 28px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 122, 0, 0.1);
            border: 2px solid var(--primary-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px var(--primary-orange-glow);
        }

        .brand-logo-circle::after {
            content: '';
            width: 14px;
            height: 14px;
            background: var(--primary-orange);
            border-radius: 50%;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
        }

        .brand span {
            font-size: 0.75rem;
            color: var(--primary-orange);
            letter-spacing: 1px;
            display: block;
        }

        .last-update {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .last-update::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Showcase Grid */
        .showcase-title {
            font-size: 0.95rem;
            color: var(--primary-orange);
            margin-bottom: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .showcase-title::before {
            content: '•';
            font-size: 1.5rem;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .showcase-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .showcase-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-orange);
            box-shadow: 0 8px 20px var(--primary-orange-glow);
        }

        .showcase-card.active {
            border: 2px solid var(--primary-orange);
            background: rgba(255, 122, 0, 0.08);
            box-shadow: 0 0 16px var(--primary-orange-glow);
        }

        .showcase-card h3 {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .showcase-card .price {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
        }

        .showcase-card .unit {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }

        /* Chart Section */
        .chart-section {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 22px;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .chart-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }

        .timeframe-bar {
            display: flex;
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 3px;
            gap: 3px;
        }

        .tf-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tf-btn:hover {
            color: #fff;
        }

        .tf-btn.active {
            background: var(--primary-orange);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 0 10px var(--primary-orange-glow);
        }

        .chart-box {
            position: relative;
            height: 420px;
            width: 100%;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .rates-container {
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 4px;
        }

        .rates-container::-webkit-scrollbar {
            width: 4px;
        }
        .rates-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }

        .rate-card {
            background: rgba(11, 15, 25, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 3px solid var(--primary-orange);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rate-card:hover {
            background: rgba(255, 122, 0, 0.06);
            transform: translateX(-3px);
        }

        .rate-card.active {
            border: 1px solid var(--primary-orange);
            border-right: 4px solid var(--primary-orange);
            background: rgba(255, 122, 0, 0.12);
        }

        .rate-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
        }

        .rate-code {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .rate-price {
            text-align: left;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .rate-unit {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        @media (max-width: 1024px) {
            .showcase-grid { grid-template-columns: repeat(3, 1fr); }
            .main-layout { grid-template-columns: 1fr; }
            .sidebar { height: 380px; }
        }

        @media (max-width: 640px) {
            .showcase-grid { grid-template-columns: repeat(2, 1fr); }
            header { flex-direction: column; gap: 12px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="brand-logo-circle"></div>
                <div>
                    <h1>شبکه هزاره</h1>
                    <span>NETWORK HEZAREH FINANCIAL LAB</span>
                </div>
            </div>
            <div id="lastUpdate" class="last-update">در حال دریافت داده‌ها...</div>
        </header>

        <!-- Showcase -->
        <div class="showcase-title">شاخص‌های اصلی بازار (شبکه هزاره)</div>
        <div id="showcaseGrid" class="showcase-grid"></div>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Chart Section -->
            <div class="chart-section">
                <div class="chart-header">
                    <div id="chartTitle" class="chart-title">نمودار روند قیمت</div>
                    <div class="timeframe-bar">
                        <button class="tf-btn" onclick="setTimeframe(1, this)">۱ روز</button>
                        <button class="tf-btn active" onclick="setTimeframe(7, this)">۱ هفته</button>
                        <button class="tf-btn" onclick="setTimeframe(30, this)">۱ ماه</button>
                        <button class="tf-btn" onclick="setTimeframe(180, this)">۶ ماه</button>
                        <button class="tf-btn" onclick="setTimeframe(365, this)">۱ سال</button>
                    </div>
                </div>
                <div class="chart-box">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <span style="color:#fff;">سایر نرخ‌های بازار</span>
                    <span id="sidebarCount" style="color:var(--primary-orange); font-size:0.85rem;"></span>
                </div>
                <div id="ratesContainer" class="rates-container"></div>
            </div>
        </div>
    </div>

    <script>
        let allRates = {};
        let currentSymbol = 'usd';
        let currentDays = 7;
        let chartInstance = null;

        // 5 شاخص ویترین بالا
        const showcaseKeys = ['usd', 'eur', 'aed', 'gold_18k', 'coin_emami'];

        async function init() {
            try {
                // تلاش اول از market.json و در صورت نیاز از api/market.json
                let res = await fetch('market.json');
                if (!res.ok) res = await fetch('api/market.json');
                const data = await res.json();

                allRates = data.rates || data;
                
                if (data.updated_at) {
                    document.getElementById('lastUpdate').textContent = `آخرین بروزرسانی: ${data.updated_at}`;
                }

                buildShowcase();
                buildSidebar();
                loadChart(currentSymbol);
            } catch (err) {
                console.error(err);
                document.getElementById('lastUpdate').textContent = 'خطا در دریافت اطلاعات';
            }
        }

        function buildShowcase() {
            const grid = document.getElementById('showcaseGrid');
            grid.innerHTML = '';

            showcaseKeys.forEach(key => {
                const item = allRates[key];
                if (!item) return;

                const card = document.createElement('div');
                card.className = `showcase-card ${currentSymbol === key ? 'active' : ''}`;
                card.id = `card-${key}`;
                card.onclick = () => selectSymbol(key);

                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <div class="price">${format(item.price)}</div>
                    <div class="unit">${item.unit || 'تومان'}</div>
                `;
                grid.appendChild(card);
            });
        }

        function buildSidebar() {
            const container = document.getElementById('ratesContainer');
            container.innerHTML = '';

            // حذف ۵ مورد اصلی از سایدبار
            const otherKeys = Object.keys(allRates).filter(k => !showcaseKeys.includes(k));
            document.getElementById('sidebarCount').textContent = `${otherKeys.length} شاخص`;

            otherKeys.forEach(key => {
                const item = allRates[key];
                if (!item) return;

                const card = document.createElement('div');
                card.className = `rate-card ${currentSymbol === key ? 'active' : ''}`;
                card.id = `card-${key}`;
                card.onclick = () => selectSymbol(key);

                card.innerHTML = `
                    <div>
                        <div class="rate-title">${item.title}</div>
                        <div class="rate-code">${key.toUpperCase()}</div>
                    </div>
                    <div class="rate-price">
                        <div>${format(item.price)}</div>
                        <div class="rate-unit">${item.unit || 'تومان'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectSymbol(key) {
            currentSymbol = key;
            document.querySelectorAll('.showcase-card, .rate-card').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`card-${key}`);
            if (activeEl) activeEl.classList.add('active');
            loadChart(key);
        }

        function setTimeframe(days, btn) {
            currentDays = days;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadChart(currentSymbol);
        }

        async function loadChart(symbol) {
            const item = allRates[symbol];
            const title = item ? item.title : symbol;
            document.getElementById('chartTitle').textContent = `نمودار روند قیمت (${title})`;

            try {
                let res = await fetch(`api/history_${symbol}.json`);
                if (!res.ok) res = await fetch(`history_${symbol}.json`);
                
                const json = await res.json();
                let history = Array.isArray(json) ? json : (json.history || []);

                // فیلتر بر اساس بازه انتخابی
                let points = history;
                if (currentDays === 1) points = history.slice(-5);
                else if (currentDays === 7) points = history.slice(-15);
                else if (currentDays === 30) points = history.slice(-30);
                else if (currentDays === 180) points = history.slice(-60);

                const labels = points.map(p => p.time || p.date || '');
                const values = points.map(p => p.price);

                renderChart(labels, values, title);
            } catch (e) {
                console.warn('History not found for', symbol);
                renderChart([], [], title);
            }
        }

        function renderChart(labels, data, label) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const gradient = ctx.createLinearGradient(0, 0, 0, 380);
            gradient.addColorStop(0, 'rgba(255, 122, 0, 0.35)');
            gradient.addColorStop(1, 'rgba(255, 122, 0, 0.0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        borderColor: '#ff7a00',
                        borderWidth: 2.5,
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.35,
                        pointRadius: data.length > 25 ? 0 : 3.5,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#ff7a00',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 1.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(11, 15, 25, 0.95)',
                            titleFont: { family: 'Vazirmatn' },
                            bodyFont: { family: 'Vazirmatn', weight: 'bold' },
                            borderColor: 'rgba(255, 122, 0, 0.3)',
                            borderWidth: 1,
                            padding: 10,
                            callbacks: {
                                label: (c) => ` ${format(c.parsed.y)} تومان`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            ticks: { color: '#9ca3af', font: { family: 'Vazirmatn', size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: {
                                color: '#9ca3af',
                                font: { family: 'Vazirmatn', size: 11 },
                                callback: (v) => format(v)
                            }
                        }
                    }
                }
            });
        }

        function format(n) {
            if (!n && n !== 0) return '۰';
            return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        window.onload = init;
    </script>
</body>
</html>
