<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرخ ارز، طلا و سکه | شبکه هزاره</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hezareh: {
                            orange: '#ea580c',
                            dark: '#0b0f19',
                            card: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .showcase-item {
            background: linear-gradient(135deg, rgba(234, 88, 12, 0.12), rgba(30, 41, 59, 0.6));
            border-right: 4px solid #ea580c;
            transition: all 0.3s ease;
        }
        .showcase-item:hover {
            transform: translateY(-4px);
            background: linear-gradient(135deg, rgba(234, 88, 12, 0.22), rgba(30, 41, 59, 0.8));
            border-color: #f97316;
        }
        .font-mono-custom { font-family: monospace; letter-spacing: -0.5px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="glass-card sticky top-0 z-50 border-b border-slate-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-5">
                <img src="logo.png" onerror="this.src='https://1000network.github.io/1000Network_Rate/logo.png'" class="h-12 w-auto object-contain" alt="شبکه هزاره">
                <div>
                    <h1 class="text-xl font-black text-white tracking-wide">شبکه هزاره</h1>
                    <p class="text-orange-500 text-[10px] font-bold tracking-widest uppercase">Network Hezareh Financial Lab</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 bg-slate-900/80 px-4 py-2 rounded-2xl border border-slate-700/60 shadow-inner">
                <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                <div class="text-left">
                    <span class="block text-[9px] text-slate-400 font-bold">آخرین بروزرسانی</span>
                    <div id="lastUpdated" class="text-sm font-black text-orange-400 font-mono-custom">در حال دریافت...</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- ویترین ۵ آیتم اصلی -->
        <section class="mb-8">
            <div class="flex items-center justify-between mb-4 px-1">
                <h2 class="text-sm font-bold text-slate-400 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-orange-500 rounded-full"></span>
                    شاخص‌های اصلی بازار (شبکه هزاره)
                </h2>
            </div>
            <div id="mainShowcase" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
                <!-- توسط جاوااسکریپت پر می‌شود -->
            </div>
        </section>

        <!-- چیدمان دو ستونه -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- ستون راست: نمودار و تب‌های انتخاب دارایی -->
            <div class="lg:col-span-2 space-y-6">
                <section class="glass-card rounded-3xl p-6 shadow-xl border border-slate-800">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <div>
                            <h3 id="chartTitle" class="text-lg font-bold text-white">نمودار روند قیمت</h3>
                            <p class="text-xs text-slate-400">تغییرات ۷ روز گذشته</p>
                        </div>
                        <div id="assetSelector" class="flex flex-wrap gap-1.5 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-800">
                            <!-- دکمه‌های تعویض نمودار -->
                        </div>
                    </div>
                    <div class="relative h-[320px] w-full">
                        <canvas id="priceChart"></canvas>
                    </div>
                </section>
            </div>

            <!-- ستون چپ: لیست کامل فشرده سایر نرخ‌ها (۳۷+ قلم) -->
            <div class="lg:col-span-1">
                <section class="glass-card rounded-3xl p-6 shadow-xl border border-slate-800 flex flex-col h-full">
                    <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <span class="w-2 h-2 bg-orange-500 rounded-full"></span>
                            سایر نرخ‌های بازار
                        </h3>
                        <span class="text-[10px] text-slate-400 bg-slate-900 px-2 py-0.5 rounded-full">۳۷+ ارز و طلا</span>
                    </div>
                    <div id="marketList" class="space-y-2.5 overflow-y-auto max-h-[480px] pr-1">
                        <!-- لیست فشرده سایر اقلام -->
                    </div>
                </section>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-card border-t border-slate-800 py-6 mt-12 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>تمامی حقوق محفوظ است | <strong class="text-slate-300">شبکه هزاره (Network Hezareh)</strong></p>
            <div class="flex gap-4">
                <a href="https://networkshop.ir" target="_blank" class="hover:text-orange-400 transition">وب‌سایت فروشگاه</a>
                <a href="https://t.me/shabake_hezareh" target="_blank" class="hover:text-orange-400 transition">کانال تلگرام</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // متادیتا و نام‌های فارسی کامل برای تمام ۳۷+ دارایی
        const ASSETS_META = {
            usd: { title: 'دلار آمریکا', symbol: 'USD', icon: '🇺🇸' },
            eur: { title: 'یورو', symbol: 'EUR', icon: '🇪🇺' },
            aed: { title: 'درهم امارات', symbol: 'AED', icon: '🇦🇪' },
            gbp: { title: 'پوند انگلیس', symbol: 'GBP', icon: '🇬🇧' },
            try: { title: 'لیر ترکیه', symbol: 'TRY', icon: '🇹🇷' },
            cad: { title: 'دلار کانادا', symbol: 'CAD', icon: '🇨🇦' },
            aud: { title: 'دلار استرالیا', symbol: 'AUD', icon: '🇦🇺' },
            cny: { title: 'یوان چین', symbol: 'CNY', icon: '🇨🇳' },
            jpy: { title: 'ین ژاپن', symbol: 'JPY', icon: '🇯🇵' },
            gold_18k: { title: 'طلای ۱۸ عیار', symbol: '18K', icon: '🪙' },
            gold_24k: { title: 'طلای ۲۴ عیار', symbol: '24K', icon: '🪙' },
            gold_mesghal: { title: 'مثقال طلا', symbol: 'MSGH', icon: '⚖️' },
            coin_emami: { title: 'سکه امامی', symbol: 'EMAMI', icon: '🥇' },
            coin_bahar: { title: 'سکه بهار آزادی', symbol: 'BAHAR', icon: '🥈' },
            coin_ نیم: { title: 'نیم سکه', symbol: 'HALF', icon: '🪙' },
            coin_ruba: { title: 'ربع سکه', symbol: 'QUARTER', icon: '🪙' },
            coin_germi: { title: 'سکه گرمی', symbol: 'GRAM', icon: '🪙' }
        };

        const MAIN_SHOWCASE_KEYS = ['usd', 'eur', 'aed', 'gold_18k', 'coin_emami'];
        let marketData = {};
        let priceChartInstance = null;
        let currentSelectedAsset = 'usd';

        function formatNumber(num) {
            if (!num) return '---';
            return new Intl.NumberFormat('fa-IR').format(num);
        }

        async function loadMarketData() {
            try {
                const res = await fetch('api/market.json');
                marketData = await res.json();
                
                const rates = marketData.rates || marketData;

                if (marketData.updated_at) {
                    document.getElementById('lastUpdated').innerText = marketData.updated_at;
                }

                renderShowcase(rates);
                renderMarketList(rates);
                renderAssetSelector(rates);
                loadChartData(currentSelectedAsset);

            } catch (err) {
                console.error('Error loading market data:', err);
            }
        }

        function renderShowcase(rates) {
            const container = document.getElementById('mainShowcase');
            container.innerHTML = '';

            MAIN_SHOWCASE_KEYS.forEach(key => {
                const meta = ASSETS_META[key] || { title: key, symbol: key, icon: '💵' };
                const val = rates[key];
                
                container.innerHTML += `
                    <div onclick="switchChart('${key}')" class="showcase-item glass-card p-4 rounded-2xl shadow-lg flex flex-col justify-between cursor-pointer">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xl">${meta.icon}</span>
                            <span class="text-[9px] font-bold text-slate-400 bg-slate-900/80 px-2 py-0.5 rounded">${meta.symbol}</span>
                        </div>
                        <div>
                            <div class="text-slate-400 text-xs font-medium mb-1">${meta.title}</div>
                            <div class="text-base font-black text-white font-mono-custom">
                                ${formatNumber(val)} <span class="text-[10px] text-slate-400 font-normal">تومان</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderMarketList(rates) {
            const container = document.getElementById('marketList');
            container.innerHTML = '';

            for (const [key, val] of Object.entries(rates)) {
                if (MAIN_SHOWCASE_KEYS.includes(key)) continue;

                const meta = ASSETS_META[key] || { title: key };
                const titleText = meta.title || key;

                container.innerHTML += `
                    <div onclick="switchChart('${key}')" class="flex items-center justify-between p-3 rounded-xl bg-slate-900/40 hover:bg-slate-900/80 border border-slate-800/60 transition cursor-pointer">
                        <span class="text-xs font-bold text-slate-300">${titleText}</span>
                        <span class="text-xs font-black text-orange-400 font-mono-custom">${formatNumber(val)} <span class="text-[9px] text-slate-500">تومان</span></span>
                    </div>
                `;
            }
        }

        function renderAssetSelector(rates) {
            const selector = document.getElementById('assetSelector');
            selector.innerHTML = '';

            // دکمه‌های پرکاربرد برای انتخاب سریع در نمودار
            const quickKeys = ['usd', 'eur', 'aed', 'gold_18k', 'coin_emami'];
            quickKeys.forEach(key => {
                const meta = ASSETS_META[key] || { title: key };
                const isActive = key === currentSelectedAsset;
                
                selector.innerHTML += `
                    <button onclick="switchChart('${key}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${isActive ? 'bg-orange-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">
                        ${meta.title}
                    </button>
                `;
            });
        }

        async function loadChartData(assetKey) {
            currentSelectedAsset = assetKey;
            const meta = ASSETS_META[assetKey] || { title: assetKey };
            document.getElementById('chartTitle').innerText = `نمودار روند قیمت (${meta.title})`;

            try {
                // تلاش برای خواندن تاریخچه از پوشه api یا charts
                const res = await fetch(`api/history_${assetKey}.json`).catch(() => null);
                let historyData = null;
                
                if (res && res.ok) {
                    historyData = await res.json();
                }

                // مقادیر پیش‌فرض اگر فایل تاریخچه موجود نبود
                const labels = historyData ? historyData.labels : ['۶ روز پیش', '۵ روز پیش', '۴ روز پیش', '۳ روز پیش', 'دیروز', 'امروز'];
                const rates = historyData ? historyData.values : [
                    marketData.rates?.[assetKey] || 0,
                    marketData.rates?.[assetKey] || 0,
                    marketData.rates?.[assetKey] || 0,
                    marketData.rates?.[assetKey] || 0,
                    marketData.rates?.[assetKey] || 0,
                    marketData.rates?.[assetKey] || 0
                ];

                renderChart(labels, rates, meta.title);
            } catch (err) {
                console.error('Error loading chart:', err);
            }
        }

        function switchChart(assetKey) {
            loadChartData(assetKey);
            renderAssetSelector(marketData.rates || marketData);
        }

        function renderChart(labels, data, labelTitle) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            
            if (priceChartInstance) {
                priceChartInstance.destroy();
            }

            priceChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: labelTitle,
                        data: data,
                        borderColor: '#ea580c',
                        backgroundColor: 'rgba(234, 88, 12, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.35,
                        pointBackgroundColor: '#ea580c',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ' ' + formatNumber(context.raw) + ' تومان';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8', font: { family: 'Vazirmatn', size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { 
                                color: '#94a3b8', 
                                font: { family: 'Vazirmatn', size: 10 },
                                callback: function(value) {
                                    return formatNumber(value);
                                }
                            }
                        }
                    }
                }
            });
        }

        // راه‌اندازی اولیه
        loadMarketData();
        setInterval(loadMarketData, 60000);
    </script>
</body>
</html>
