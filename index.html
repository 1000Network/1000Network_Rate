<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرخ لحظه‌ای ارز، طلا و سکه | شبکه هزاره</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 122, 0, 0.2);
            --primary-orange: #ff7a00;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: linear-gradient(135deg, #111827 0%, #1f2937 100%); border-bottom: 2px solid var(--primary-orange); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .logo-area { display: flex; align-items: center; gap: 20px; }
        .logo-icon { width: 55px; height: 55px; border: 3px solid var(--primary-orange); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
        .logo-icon::after { content: ''; width: 12px; height: 12px; background: var(--primary-orange); border-radius: 50%; position: absolute; }
        .brand-title h1 { font-size: 24px; color: #fff; font-weight: 800; }
        .brand-title span { font-size: 13px; color: var(--primary-orange); letter-spacing: 1px; font-weight: 600; }
        .header-meta { text-align: left; }
        .update-badge { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .update-badge::before { content: ''; width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 30px; }
        
        /* Showcase Grid (5 items side by side) */
        .showcase-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .showcase-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); transition: transform 0.3s, border-color 0.3s; cursor: pointer; position: pointer; }
        .showcase-card:hover, .showcase-card.active { transform: translateY(-5px); border-color: var(--primary-orange); box-shadow: 0 8px 25px rgba(255, 122, 0, 0.15); }
        .item-name { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .item-price { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; direction: ltr; text-align: right; }
        .item-change { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; }
        .item-change.up { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .item-change.down { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        /* Main Section */
        .main-content { display: grid; grid-template-columns: 350px 1fr; gap: 25px; }
        .card-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); }
        .section-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        
        .rates-list { display: flex; flex-direction: column; gap: 10px; max-height: 550px; overflow-y: auto; padding-left: 5px; }
        .rates-list::-webkit-scrollbar { width: 5px; }
        .rates-list::-webkit-scrollbar-thumb { background: var(--primary-orange); border-radius: 10px; }
        .rate-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: rgba(255,255,255,0.02); border-radius: 10px; transition: background 0.2s; cursor: pointer; border: 1px solid transparent; }
        .rate-row:hover { background: rgba(255, 122, 0, 0.08); border-color: rgba(255, 122, 0, 0.2); }
        
        .chart-container { position: relative; height: 450px; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        footer { background: #080b12; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px; margin-top: auto; }

        @media(max-width: 1200px) { .showcase-grid { grid-template-columns: repeat(3, 1fr); } .main-content { grid-template-columns: 1fr; } }
        @media(max-width: 768px) { .showcase-grid { grid-template-columns: repeat(1, 1fr); } header { flex-direction: column; gap: 15px; text-align: center; } .header-meta { text-align: center; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon"></div>
            <div class="brand-title">
                <h1>شبکه هزاره</h1>
                <span>NETWORK HEZAREH FINANCIAL LAB</span>
            </div>
        </div>
        <div class="header-meta">
            <div id="updateTime" class="update-badge">در حال بارگذاری...</div>
        </div>
    </header>

    <div class="container">
        <!-- 5 Showcase Items (USD, EUR, AED, Gold 18k, Emami Coin) -->
        <div id="showcaseGrid" class="showcase-grid">
            <div class="showcase-card">بارگذاری اطلاعات...</div>
        </div>

        <div class="main-content">
            <!-- Left Panel: All Rates -->
            <div class="card-box">
                <div class="section-title">
                    <span>سایر نرخ‌های بازار</span>
                    <span id="totalCount" style="font-size: 12px; color: var(--primary-orange);">موجودی: --</span>
                </div>
                <div id="ratesList" class="rates-list">
                    <div style="text-align: center; color: var(--text-muted); padding: 20px;">در حال دریافت اطلاعات بازار...</div>
                </div>
            </div>

            <!-- Right Panel: Chart -->
            <div class="card-box">
                <div class="section-title">
                    <span id="chartTitle">نمودار روند قیمت</span>
                    <span style="font-size: 12px; color: var(--text-muted);">تغییرات ۷ روز گذشته</span>
                </div>
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <footer>
        تمامی حقوق محفوظ است | شبکه هزاره (Network Hezareh) &copy; 2026
    </footer>

    <script>
        let marketData = {};
        let myChart = null;
        let currentSelectedKey = 'usd';

        const showcaseKeys = ['usd', 'eur', 'aed', 'gold_18k', 'coin_emami'];

        async function loadMarketData() {
            try {
                const response = await fetch('api/market.json?' + new Date().getTime());
                if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                marketData = await response.json();
                
                renderUI();
            } catch (err) {
                console.error(err);
                document.getElementById('updateTime').innerText = 'خطا در ارتباط با سرور داده';
            }
        }

        function renderUI() {
            // Update timestamp
            if (marketData.last_update) {
                document.getElementById('updateTime').innerText = `آخرین بروزرسانی: ${marketData.last_update}`;
            }

            const items = marketData.items || {};
            const keys = Object.keys(items);
            document.getElementById('totalCount').innerText = `${keys.length}+ ارز و طلا`;

            // Render Showcase (5 items)
            const showcaseHTML = showcaseKeys.map(key => {
                const item = items[key];
                if (!item) return '';
                const changeClass = item.change >= 0 ? 'up' : 'down';
                const changeSign = item.change >= 0 ? '+' : '';
                return `
                    <div class="showcase-card ${currentSelectedKey === key ? 'active' : ''}" onclick="selectAsset('${key}')">
                        <div class="item-name">${item.title}</div>
                        <div class="item-price">${formatPrice(item.price)} <span style="font-size:12px; font-weight:400; color:var(--text-muted);">تومان</span></div>
                        <div><span class="item-change ${changeClass}">${changeSign}${item.change}%</span></div>
                    </div>
                `;
            }).join('');
            document.getElementById('showcaseGrid').innerHTML = showcaseHTML;

            // Render Full List
            const listHTML = keys.map(key => {
                const item = items[key];
                const changeClass = item.change >= 0 ? 'up' : 'down';
                const changeSign = item.change >= 0 ? '+' : '';
                return `
                    <div class="rate-row" onclick="selectAsset('${key}')">
                        <div>
                            <div style="font-weight: 600; font-size: 14px; color:#fff;">${item.title}</div>
                            <div style="font-size: 11px; color: var(--text-muted);">${changeSign}${item.change}%</div>
                        </div>
                        <div style="text-align: left; direction: ltr;">
                            <div style="font-weight: 700; font-size: 15px; color: var(--primary-orange);">${formatPrice(item.price)}</div>
                            <div style="font-size: 11px; color: var(--text-muted);">تومان</div>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('ratesList').innerHTML = listHTML;

            // Load default or selected chart
            loadChart(currentSelectedKey);
        }

        function formatPrice(price) {
            if (!price) return '۰';
            return new Intl.NumberFormat('fa-IR').format(price);
        }

        async function selectAsset(key) {
            currentSelectedKey = key;
            // Update active states in showcase
            document.querySelectorAll('.showcase-card').forEach(card => card.classList.remove('active'));
            loadChart(key);
            renderUI();
        }

        async function loadChart(key) {
            const item = marketData.items[key];
            if (!item) return;

            document.getElementById('chartTitle').innerText = `نمودار روند قیمت (${item.title})`;

            try {
                const res = await fetch(`charts/${key}.json?` + new Date().getTime());
                if (!res.ok) throw new Error('تاریخچه یافت نشد');
                const history = await res.json();

                const labels = history.map(h => h.date || h.time);
                const data = history.map(h => h.price);

                renderChart(labels, data, item.title);
            } catch (e) {
                // Fallback dummy chart if history file not yet generated
                renderChart(['امروز'], [item.price], item.title);
            }
        }

        function renderChart(labels, data, title) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: title,
                        data: data,
                        borderColor: '#ff7a00',
                        backgroundColor: 'rgba(255, 122, 0, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: '#ff7a00'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#9ca3af', font: { family: 'Vazirmatn' } }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { 
                                color: '#9ca3af', 
                                font: { family: 'Vazirmatn' },
                                callback: function(value) { return new Intl.NumberFormat('fa-IR').format(value); }
                            }
                        }
                    }
                }
            });
        }

        loadMarketData();
        setInterval(loadMarketData, 60000); // Refresh every 1 min
    </script>
</body>
</html>
